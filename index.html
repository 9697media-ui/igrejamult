<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MULT. — Em breve</title>
  <meta name="description" content="Igreja Mult — site oficial em breve. Fomos chamados para viver & compartilhar a fé em Jesus de maneira autêntica." />
  <meta property="og:title" content="MULT. — Em breve" />
  <meta property="og:description" content="Igreja Mult — site oficial em breve." />

  <style>
    @font-face {
      font-family: 'Druk Wide';
      src: url('assets/fonts/DrukWideBold.ttf') format('truetype');
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Mono45';
      src: url('assets/fonts/Mono45Headline-Regular.ttf') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Mono45 Light';
      src: url('assets/fonts/Mono45Headline-Light.ttf') format('truetype');
      font-weight: 300;
      font-display: swap;
    }

    :root {
      --orange: #FA4C00;
      --ink: #ffffff;
      --bg: #000000;
      --muted: rgba(255, 255, 255, 0.46);
      --line: rgba(255, 255, 255, 0.18);
      --pad: clamp(22px, 4vw, 46px);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Mono45', monospace;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: var(--pad);
      position: relative;
      overflow: hidden;
    }

    /* moldura fina — estilo apresentação Mult */
    .frame {
      position: fixed;
      inset: 16px;
      border: 1px solid var(--line);
      pointer-events: none;
      z-index: 3;
    }

    /* ---------- CABEÇALHO ---------- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
      z-index: 2;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .globe { width: clamp(30px, 3.4vw, 40px); height: auto; flex: none; }
    .tagline {
      font-family: 'Mono45', monospace;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: clamp(7.5px, 1.05vw, 10.5px);
      line-height: 1.75;
      color: var(--ink);
    }
    .meta {
      text-align: right;
      font-family: 'Mono45', monospace;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: clamp(7.5px, 1.05vw, 10.5px);
      line-height: 1.9;
      color: var(--muted);
      padding-left: 0.28em;
    }
    .meta b { color: var(--ink); font-weight: 400; }

    /* ---------- CENTRO ---------- */
    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(26px, 4.5vw, 44px);
      text-align: center;
    }

    .badge {
      background: var(--orange);
      width: clamp(168px, 24vw, 232px);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 24px 80px rgba(250, 76, 0, 0.22);
    }
    .badge .wordmark { width: 66%; height: auto; display: block; }
    .wordmark text { font-family: 'Druk Wide', sans-serif; }

    .soon-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .soon {
      font-family: 'Druk Wide', sans-serif;
      text-transform: uppercase;
      font-size: clamp(30px, 7vw, 68px);
      line-height: 0.98;
      letter-spacing: 0.01em;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 0.16em;
    }
    /* palavra vazada — detalhe da marca */
    .soon .hollow {
      color: transparent;
      -webkit-text-stroke: 2px var(--ink);
      text-stroke: 2px var(--ink);
    }
    .soon .dash {
      color: var(--orange);
      -webkit-text-stroke: 0;
    }
    .label {
      font-family: 'Mono45', monospace;
      text-transform: uppercase;
      letter-spacing: 0.42em;
      padding-left: 0.42em;
      font-size: clamp(9px, 1.5vw, 12px);
      color: var(--muted);
    }

    /* ---------- RODAPÉ ---------- */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-family: 'Mono45 Light', monospace;
      text-transform: uppercase;
      letter-spacing: 0.26em;
      font-size: clamp(7.5px, 1.05vw, 10.5px);
      color: var(--muted);
      z-index: 2;
    }
    .footer .accent { color: var(--orange); }

    @media (max-width: 640px) {
      .frame { inset: 10px; }
      .tagline { letter-spacing: 0.16em; }
      .meta .hide-sm { display: none; }
      .footer .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <div class="frame"></div>

  <!-- CABEÇALHO -->
  <header class="header">
    <div class="brand">
      <svg class="globe" viewBox="0 0 100 100" role="img" aria-label="Mult">
        <g fill="none" stroke="#ffffff" stroke-width="4">
          <circle cx="50" cy="50" r="46" />
          <line x1="50" y1="4" x2="50" y2="96" />
          <ellipse cx="50" cy="50" rx="23" ry="46" />
          <line x1="4" y1="50" x2="96" y2="50" />
          <line x1="11" y1="27" x2="89" y2="27" />
          <line x1="11" y1="73" x2="89" y2="73" />
        </g>
      </svg>
      <div class="tagline">
        Fomos chamados para viver &amp; compartilhar<br />
        a fé em Jesus de maneira autêntica
      </div>
    </div>
    <div class="meta">
      <span class="hide-sm">Site oficial da Mult<br /></span>
      <b>Em breve</b> — 2026
    </div>
  </header>

  <!-- CENTRO -->
  <main class="stage">
    <!-- Logo oficial: wordmark MULT. (Druk Wide Bold) branco sobre laranja -->
    <div class="badge">
      <svg class="wordmark" viewBox="0 0 320 84" role="img" aria-label="MULT.">
        <text x="160" y="45" text-anchor="middle" dominant-baseline="central"
              textLength="300" lengthAdjust="spacingAndGlyphs"
              font-size="66" fill="#ffffff">MULT.</text>
      </svg>
    </div>

    <div class="soon-wrap">
      <div class="soon">
        <span>Em</span><span class="hollow">Breve</span><span class="dash">_</span>
      </div>
      <div class="label">Estamos construindo algo novo</div>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="footer">
    <div>Igreja Mult</div>
    <div class="hide-sm">Projeto de plantação</div>
    <div><span class="accent">///</span> Em construção</div>
  </footer>
</body>
</html>
